name: Wake Hermes Sprite

# GitHub's ONLY job: wake the Hermes sprite every 6 hours
# (05:50/11:50/17:50/23:50 UTC). Keep 05:50 because the
# primod-daily-intel Hermes cron at 06:00 UTC needs the sprite awake.
# All intel collection, briefing, and delivery happens inside Hermes cron —
# this repo does nothing but ping the sprite URL.

on:
  schedule:
    # Every 6 hours at 05:50/11:50/17:50/23:50 UTC
    - cron: '50 5,11,17,23 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping sprite URL to wake it
        run: |
          curl -fsS -o /dev/null -m 30 \
            https://hermes-agent-btb7p.sprites.app/ \
            || echo "wake-ping-sent (sprite may not respond to plain GET — that's fine, the request still wakes it)"
